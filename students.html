<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학생 활동 기록 | 기술 세특 스튜디오</title>
  <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/overrides.css?v=final-layout-2"><link rel="stylesheet" href="/students.css">
  <script type="module" src="/students.js"></script>
</head>
<body><div class="shell">
  <header class="topbar"><a class="brand" href="/">기술 세특 스튜디오</a><a href="/">교사 초안 작성</a></header>
  <main class="student-main">
    <section class="intro"><p class="eyebrow">LEARNING RECORD</p><h1>내가 한 활동을<br><em>나의 말로 기록해요.</em></h1><p class="intro-copy">수업에서 직접 한 일과 배운 점을 적어 선생님께 제출하세요.</p></section>
    <p id="notice" role="status" aria-live="polite">연결을 확인하고 있습니다…</p>
    <section id="auth-panel" class="panel student-panel">
      <h2>학생·교사 로그인</h2><p>처음이라면 회원가입 후 이메일 인증을 완료해 주세요.</p>
      <form id="auth-form"><fieldset id="auth-fields" disabled>
        <label class="field"><span class="field-label">이메일</span><input id="email" type="email" autocomplete="username" maxlength="254" required></label>
        <label class="field"><span class="field-label">비밀번호</span><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></label>
        <div class="actions"><button class="primary-button" type="submit">로그인</button><button class="download-button" id="signup" type="button">회원가입</button></div>
      </fieldset></form>
    </section>
    <section id="account-panel" class="panel student-panel" hidden><div class="actions"><p id="account-label"></p><button id="logout" class="download-button" type="button">로그아웃</button></div></section>
    <section id="submission-panel" class="panel student-panel" hidden>
      <h2>수업 활동 제출</h2><p>이름·연락처는 활동 내용에 쓰지 마세요. 제출한 기록은 본인과 담당 교사가 확인합니다.</p>
      <form id="submission-form">
        <div class="field-row">
          <label class="field"><span class="field-label">학번 또는 수업용 번호</span><input name="student_number" maxlength="30" required placeholder="예: 20701"></label>
          <label class="field"><span class="field-label">학년·학기</span><input name="grade_term" maxlength="40" required placeholder="예: 중학교 2학년 1학기"></label>
        </div>
        <label class="field"><span class="field-label">과목·단원</span><input name="course_unit" maxlength="100" required placeholder="예: 기술·가정 / 기술의 활용"></label>
        <label class="field"><span class="field-label">활동 제목</span><input name="activity_title" maxlength="160" required placeholder="예: 생활 문제 해결 제품 만들기"></label>
        <label class="field"><span class="field-label">직접 수행한 활동과 근거</span><textarea name="evidence" rows="5" maxlength="1400" required placeholder="조사·설계·제작·시험한 일과 결과를 구체적으로 적어 주세요."></textarea></label>
        <label class="field"><span class="field-label">팀 프로젝트 주제와 결과물 (선택)</span><textarea name="project" rows="3" maxlength="900"></textarea></label>
        <label class="field"><span class="field-label">내 역할과 개인 기여</span><textarea name="contribution" rows="3" maxlength="1200" required placeholder="팀이 한 일 중 내가 직접 맡아 수행한 일을 적어 주세요."></textarea></label>
        <label class="field"><span class="field-label">문제 해결 과정 (선택)</span><textarea name="problem_solving" rows="3" maxlength="1200" placeholder="겪은 문제, 바꿔 본 방법, 개선된 결과를 적어 주세요."></textarea></label>
        <label class="field"><span class="field-label">배운 점과 성찰</span><textarea name="reflection" rows="4" maxlength="900" required placeholder="배운 점, 피드백을 반영한 변화, 다음에 개선할 점을 적어 주세요."></textarea></label>
        <label class="consent"><input name="confirmed" type="checkbox" required> 내가 실제로 한 활동을 작성했으며, 선생님의 확인을 위해 제출합니다.</label>
        <button id="submit-record" class="primary-button" type="submit">활동 기록 제출하기</button>
      </form>
    </section>
    <section id="history-panel" class="panel student-panel" hidden>
      <div class="actions"><h2 id="history-title">내 제출 내역</h2><button id="refresh" class="download-button" type="button">새로고침</button></div>
      <form id="filter-form" class="actions" hidden><label class="field">학번<input id="filter-number" maxlength="30" placeholder="정확한 학번"></label><label class="field">과목·단원<input id="filter-course" maxlength="100" placeholder="정확한 과목·단원"></label><button class="download-button" type="submit">검색</button></form>
      <p id="history-status" role="status"></p><div id="records"></div>
      <div class="actions"><button id="previous" type="button" class="download-button" disabled>이전</button><span id="page-label"></span><button id="next" type="button" class="download-button" disabled>다음</button></div>
    </section>
  </main><footer class="page-footer">학생의 기록을 교사의 관찰과 함께 확인하는 공간</footer>
</div></body></html>
